<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>中文网页保存到 Obsidian</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2328;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .field {
        margin-bottom: 10px;
      }

      .label {
        margin-bottom: 4px;
        font-size: 12px;
        color: #57606a;
      }

      .value {
        font-size: 13px;
        line-height: 1.45;
        word-break: break-all;
      }

      input,
      select {
        width: 100%;
        padding: 7px 8px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        box-sizing: border-box;
        background: #ffffff;
        font-size: 13px;
      }

      input + .label {
        margin-top: 8px;
      }

      details {
        padding: 8px 0;
        border-top: 1px solid #d8dee4;
        border-bottom: 1px solid #d8dee4;
      }

      summary {
        font-size: 13px;
        cursor: pointer;
      }

      .hidden {
        display: none;
      }

      button {
        width: 100%;
        margin-top: 8px;
        padding: 9px 10px;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        background: #0969da;
        font-size: 14px;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        background: #8c959f;
      }

      .secondary {
        color: #24292f;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
      }

      .secondary:disabled {
        color: #57606a;
        background: #f6f8fa;
      }

      #status {
        margin-top: 10px;
        min-height: 18px;
        font-size: 12px;
        line-height: 1.45;
        color: #57606a;
        white-space: pre-wrap;
      }

      .error {
        color: #cf222e;
      }

      .success {
        color: #1a7f37;
      }
    </style>
  </head>
  <body>
    <h1>中文网页保存到 Obsidian</h1>

    <div class="field">
      <div class="label">当前页面标题</div>
      <div id="title" class="value">读取中...</div>
    </div>

    <div class="field">
      <div class="label">作者</div>
      <div id="author" class="value">读取中...</div>
    </div>

    <div class="field">
      <div class="label">原文链接</div>
      <div id="url" class="value">读取中...</div>
    </div>

    <div id="candidateField" class="field hidden">
      <div class="label">选择要保存的回答/正文</div>
      <select id="candidate"></select>
    </div>

    <div id="commentField" class="field hidden">
      <div class="label">评论范围</div>
      <select id="commentMode">
        <option value="none">不保存评论</option>
        <option value="all">保存已显示评论</option>
        <option value="author">仅保存已显示的答主回复</option>
      </select>
    </div>

    <details class="field">
      <summary>保存目录</summary>
      <div class="field">
        <div class="label">当前保存到</div>
        <div id="targetDir" class="value">读取中...</div>
      </div>
      <div class="field">
        <div class="label">Vault 路径</div>
        <input id="vaultPath" type="text" placeholder="/Users/你的用户名/Documents/ObsidianVault">
        <button id="chooseVault" class="secondary" type="button">选择并保存 Vault 文件夹</button>
        <div class="label">Vault 内文件夹</div>
        <input id="saveFolder" type="text" placeholder="网页收藏">
        <div class="label">知乎保存文件夹</div>
        <input id="zhihuFolder" type="text" placeholder="知乎">
        <div class="label">财新保存文件夹</div>
        <input id="caixinFolder" type="text" placeholder="财新">
        <div class="label">知识星球保存文件夹</div>
        <input id="zsxqFolder" type="text" placeholder="知识星球">
        <div class="label">微信公众号保存文件夹</div>
        <input id="wechatFolder" type="text" placeholder="微信公众号">
        <button id="saveConfig" class="secondary" type="button">保存路径设置</button>
      </div>
    </details>

    <button id="save" type="button" disabled>保存到 Obsidian</button>
    <div id="status">正在读取当前页面...</div>

    <script src="popup.js"></script>
  </body>
</html>
